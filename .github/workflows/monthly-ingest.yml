name: Mesečni ingest

# APR objavljuje nov presek početkom meseca. Peti dan u 03:00 UTC je dovoljno
# kasno da presek bude objavljen, a dovoljno rano da imamo ceo mesec za reakciju.
on:
  schedule:
    - cron: "0 3 5 * *"
  workflow_dispatch:

# Dva ingesta u isto vreme bi se otimala oko istog preseka. Tekući se pušta da
# završi, jer prekid u pola upisa istorije traži ponovni prolaz.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Ključevi žive u GitHub okruženju "Production" (Settings > Environments),
    # a ne na nivou repoa. Bez ove linije job ih ne vidi i `secrets.*` je prazno.
    #
    # Okruženja Production/Preview je napravila Vercel integracija. Pre nego što
    # se Vercel isključi, ključeve preseliti na nivo repoa i ovu liniju obrisati —
    # inače CI zavisi od platforme sa koje se selimo.
    environment: Production

    # 30 min je bilo dovoljno dok se NBS korak tiho preskakao. Sada stvarno
    # radi (5000 firmi, konkurentnost 6), pa je prag podignut. Repo je public,
    # GitHub minuti su neograničeni. Posle prvog pravog prolaza podesiti po meri.
    timeout-minutes: 120

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # NBS javna pretraga dužnika nema registraciju ni captchu, pa nema ni
      # kredencijala — traži se samo pristojan User-Agent (scripts/lib/nbs-client.ts:19).
      # Raniji NBS_USERNAME/NBS_PASSWORD nisu postojali nigde u kodu.
      NBS_UA: ${{ secrets.NBS_UA }}

    steps:
      - uses: actions/checkout@v4

      # Produkcija radi na Node 24 (Dockerfile, package.json engines). Ingest je
      # do 27.08.2026. radio na 22 — dve različite major verzije nad istom bazom.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instaliraj zavisnosti
        run: npm ci

      - name: Proveri da su tajne postavljene
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Nedostaje NEXT_PUBLIC_SUPABASE_URL ili SUPABASE_SERVICE_ROLE_KEY."
            echo "Postavi ih u Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Ingest sam prekida ako broj firmi odstupa preko 5% od prethodnog preseka
      # ili ako je preskočeno preko 1% redova. Izlaz se čuva da bi se posle
      # razlikovalo "obradjen nov presek" od "presek već obrađen".
      - name: Ingest
        id: ingest
        run: |
          set -o pipefail
          npm run ingest 2>&1 | tee ingest.log
          if grep -q "presek već obrađen" ingest.log; then
            echo "nov_presek=ne" >> "$GITHUB_OUTPUT"
          else
            echo "nov_presek=da" >> "$GITHUB_OUTPUT"
          fi

      - name: Testovi
        run: npm test

      # SEO.md 2.3: nula orphan stranica. Nova firma moze da stigne sa sifrom
      # delatnosti koja jos nema svoju stranicu, i tada je nedostupna nijednim
      # internim linkom. Sa 133k stranica interno linkovanje je jedina poluga
      # koja realno pomera indeksiranje, pa ovo mora da pukne glasno.
      - name: Orphan provera
        run: npx tsx scripts/proveri-orphan.ts

      # Rebuild se NAMERNO ne radi (odluka 27.08.2026).
      #
      # Stranice šalju `s-maxage=2592000, stale-while-revalidate=28944000`, dakle
      # ISR od 30 dana već poklapa ritam APR preseka, a SWR znači da korisnik
      # nikad ne čeka regeneraciju. Prisilan rebuild bi umesto toga obrisao ceo
      # ISR keš (~31 GB, ~239 KB po firmi) i naterao 133.634 stranice da se
      # regenerišu u isto vreme.
      #
      # Purge-uju se samo hub stranice i sitemapi, koji MORAJU odmah da pokažu
      # nov presek. Stranice firmi ističu same, raspoređeno kroz mesec.
      - name: Cloudflare purge (hub stranice i sitemapi)
        if: steps.ingest.outputs.nov_presek == 'da'
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SAJT: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://firme.biznisprice.com' }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "CF_ZONE_ID ili CF_API_TOKEN nisu postavljeni, preskačem purge."
            exit 0
          fi
          putanje="/ /najvece /najvece/prihod /najvece/dobit /najvece/zaposleni \
                   /delatnost /grad /mapa/firme /mapa/prihod /mapa/zaposleni \
                   /sitemap.xml /sitemaps/staticne.xml /sitemaps/kategorije.xml \
                   /sitemaps/firme-1.xml"
          spisak=$(for p in $putanje; do printf '"%s%s",' "$SAJT" "$p"; done | sed 's/,$//')
          curl --fail --silent --show-error -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"files\":[$spisak]}" > /dev/null
          echo "Cloudflare purge urađen za hub stranice i sitemape."

      # Do 27.08.2026. je ovaj korak tražio scripts/enrich-pib.ts, koji nikad
      # nije postojao (prave skripte su enrich-pib-blokade.ts i enrich-pib-rir.ts),
      # pa se svakog meseca tiho preskakao. Guard je uz to gledao NBS_USERNAME i
      # NBS_PASSWORD, koje nijedna skripta ne čita.
      #
      # Podrazumevano ide top 5000 firmi po prihodu (scripts/enrich-pib-blokade.ts:36).
      # Ceo set je --limit=0 i traje satima — to se pokreće ručno, ne u cron-u.
      #
      # Ide POSLEDNJI, posle purge-a: NBS je javni sajt koji se skrejpuje i ume
      # da padne. Njegov ispad ne sme da spreči da hub stranice pokažu nov presek.
      - name: PIB i blokade iz NBS
        if: steps.ingest.outputs.nov_presek == 'da'
        run: |
          npm run enrich-nbs
          npm run enrich-nbs-rir

      - name: Izveštaj
        if: always()
        run: |
          {
            echo "## Mesečni ingest"
            echo
            if [ "${{ steps.ingest.outputs.nov_presek }}" = "ne" ]; then
              echo "Presek je već bio obrađen, ništa nije upisano. To je uspeh, ne greška."
            fi
            echo '```'
            tail -n 30 ingest.log 2>/dev/null || echo "Nema izlaza, ingest nije ni startovao."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
